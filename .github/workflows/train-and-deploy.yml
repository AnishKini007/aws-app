################################################################################
# MLOps CI/CD Pipeline
#
# Triggered on every push to main.
# Jobs:
#   1. test        — lint + unit tests
#   2. train       — DVC pipeline (preprocess → train → quality gate)
#   3. build-push  — Docker build → push to ECR   [only if train passes]
#   4. deploy      — Force new ECS deployment      [only if build-push passes]
#
# Required GitHub Secrets:
#   AWS_ROLE_ARN          — IAM role ARN for OIDC (recommended over access keys)
#   AWS_REGION            — e.g. ap-south-1
#   ECR_REPOSITORY_URL    — from `terraform output ecr_repository_url`
#   MLFLOW_TRACKING_URI   — from `terraform output mlflow_tracking_uri`
#   ECS_CLUSTER_NAME      — from `terraform output ecs_cluster_name`
#   ECS_SERVICE_NAME      — from `terraform output ecs_service_name`
#   DATA_BUCKET_NAME      — from `terraform output data_bucket_name`
################################################################################

name: MLOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write   # required for OIDC auth with AWS
  contents: read

env:
  PYTHON_VERSION: "3.11"
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ── Job 1: Lint + Unit Tests ─────────────────────────────────────────────────
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r model/requirements.txt flake8 pytest

      - name: Lint (flake8)
        run: flake8 model/src/ serving/app/ --max-line-length=100 --ignore=E501,W503,E221,E241

      - name: Unit tests
        run: pytest model/tests/ -v --tb=short

  # ── Job 2: Train + Quality Gate ──────────────────────────────────────────────
  train:
    name: Train & Quality Gate
    runs-on: ubuntu-latest
    needs: test
    # Only run training on push to main, not on PRs (saves cost)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r model/requirements.txt dvc[s3]

      - name: Configure DVC remote
        working-directory: model
        run: |
          dvc remote add -d s3remote s3://${{ secrets.DATA_BUCKET_NAME }}/dvc-cache
          dvc remote modify s3remote region ${{ secrets.AWS_REGION }}

      - name: Pull data from DVC remote
        working-directory: model
        run: dvc pull data/raw

      - name: Run DVC pipeline (preprocess → train → evaluate)
        working-directory: model
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          GITHUB_SHA: ${{ github.sha }}
        run: dvc repro

      - name: Push updated DVC cache
        working-directory: model
        run: dvc push

      - name: Upload mlflow_run_id artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-run-id
          path: model/mlflow_run_id.txt

  # ── Job 3: Build & Push Docker Image ─────────────────────────────────────────
  build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: train

    outputs:
      image_uri: ${{ steps.build.outputs.image_uri }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        id: build
        working-directory: serving
        env:
          ECR_REPO: ${{ secrets.ECR_REPOSITORY_URL }}
        run: |
          IMAGE_URI="${ECR_REPO}:${{ env.IMAGE_TAG }}"
          LATEST_URI="${ECR_REPO}:latest"

          docker build \
            --cache-from "${LATEST_URI}" \
            --tag "${IMAGE_URI}" \
            --tag "${LATEST_URI}" \
            .

          docker push "${IMAGE_URI}"
          docker push "${LATEST_URI}"

          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

  # ── Job 4: Deploy to ECS ──────────────────────────────────────────────────────
  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: build-push

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster  ${{ secrets.ECS_CLUSTER_NAME }} \
            --service  ${{ secrets.ECS_SERVICE_NAME }} \
            --force-new-deployment

      - name: Wait for service stability
        run: |
          aws ecs wait services-stable \
            --cluster ${{ secrets.ECS_CLUSTER_NAME }} \
            --services ${{ secrets.ECS_SERVICE_NAME }}

      - name: Deployment summary
        run: |
          echo "### Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** ${{ needs.build-push.outputs.image_uri }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Cluster:** ${{ secrets.ECS_CLUSTER_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Service:** ${{ secrets.ECS_SERVICE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
